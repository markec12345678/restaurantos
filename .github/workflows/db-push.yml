name: DB Push to Neon
on:
  workflow_dispatch:

jobs:
  db-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/webauthn-csp-security
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # P1-deps: bun + frozen lockfile (edini package manager; npm bi
      # regeneriral package-lock.json — drift)
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: Push schema to Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bunx prisma db push --accept-data-loss
      - name: Seed minimal data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/seed-minimal.mjs || true
      - name: Post results to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment 68 --body "## Neon DB Push Complete ✅

          All 94 tables created in Neon PostgreSQL.
          Seed data added (users + menu items).

          Test:
          - PIN 1234 → admin
          - PIN 0000 → staff" || true

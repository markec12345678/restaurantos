# ============================================
# RestaurantOS — Continuous Integration (P1-20)
# ============================================
# Minimalni CI pipeline — VSAK stage je BRAKING (noben continue-on-error
# na kvaliteti, razen eksplicitno dokumentiranih advisory korakov).
#
# Stages (uporabniška specifikacija):
#   1. install with frozen lockfile   (vsak job: bun install --frozen-lockfile)
#   2. typecheck                      (quality)
#   3. lint                           (quality — z WARNING BUDGETOM, glej spodaj)
#   4. unit tests                     (unit-tests)
#   5. integration tests              (integration-tests — pravi PostgreSQL)
#   6. migration test                 (migration-test — db push + drift check)
#   7. build                          (build — production Next.js build)
#   8. security tests                 (security — bun audit CRITICAL blokira + gitleaks)
#   9. E2E tests                      (e2e-security — Playwright, zahteva build)
#
# Build NI uspešen, če: (uporabniška specifikacija)
#   - E2E testi padajo            → e2e-security job fail-a (ni continue-on-error)
#   - migration test pade         → migration-test job fail-a (drift = exit 1)
#   - TypeScript napake           → tsc --noEmit fail-a + next.config ignoreBuildErrors: false
#   - lint napake so warningi     → eslint --max-warnings 1486 (budget/ratchet —
#                                   NOVE warninge fail-a, obstoječe postopoma znižujemo)
#   - production build ni preverjen → build job zaze pravi `next build`
# ============================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Prekliče tekoče build-e, ko nov commit prispe na isti PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # P1-deps: pin bun verzijo (packageManager: bun@1.3.14 v package.json)
  # — reproducibilnost CI namesto "latest"
  BUN_VERSION: "1.3.14"

jobs:
  # ───────────────────────────────────────────
  # Job 1: Lint + Typecheck + Prisma validate
  # ───────────────────────────────────────────
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # prisma validate/generate zahtevajo, da je DATABASE_URL prisoten
      # (vrednost je dummy — validate preverja samo format schem-e, ne povezavo)
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: ESLint (0 error + warning budget 1486)
        # P1-20: warningi NISO tiho zeleni — budget (ratchet) fail-a vsak NOVI
        # warning. Znižujemo ga postopoma (798 no-console + 675 no-unused-vars).
        run: npx eslint . --max-warnings 1486

      - name: TypeScript typecheck (no emit)
        run: bunx tsc --noEmit

  # ───────────────────────────────────────────
  # Job 2: Unit tests (Vitest — 1300+ tests, mockiran db)
  # ───────────────────────────────────────────
  unit-tests:
    name: Unit Tests (1300+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-prod"
      ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ENCRYPTION_KEY_VERSION: "ci-v1"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run unit tests (mocked db — fast feedback)
        run: bunx vitest run --reporter=dot

      - name: Run security tests (P0-C1..C5 + P1 matrika)
        run: bunx vitest run tests/unit/security/ --reporter=dot

  # ───────────────────────────────────────────
  # Job 3: Integration tests (P1-20 — NOV)
  # Pravi PostgreSQL + pravi Prisma klient (BREZ mockov)
  # ───────────────────────────────────────────
  integration-tests:
    name: Integration Tests (real DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-prod"
      ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ENCRYPTION_KEY_VERSION: "ci-v1"
      NODE_ENV: "test"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Push schema to PostgreSQL
        run: bunx prisma db push --skip-generate

      - name: Run integration tests (db-invariants — unique/FK/decimal/P2002)
        run: bun run test:integration -- --reporter=dot

  # ───────────────────────────────────────────
  # Job 4: Migration test (P1-20 — NOV)
  # Projekt uporablja prisma db push flow (prisma/migrations je prazna) —
  # "migration test" = schema DDL se generira + PUSH-ANA baza ni v driftu
  # ───────────────────────────────────────────
  migration-test:
    name: Migration Test (schema drift)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: "Test 1: schema → SQL DDL se uspešno generira"
        run: bunx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /dev/null

      - name: Push schema to fresh PostgreSQL
        run: bunx prisma db push --skip-generate

      - name: "Test 2: baza po db push NI v driftu s schemo (exit 1 = FAIL)"
        # migrate diff --exit-code vrne 1, če obstaja RAZLIKA med živo bazo in
        # schema.prisma. To ulovi: schema spremenjena, db push neveljaven/obskodovan.
        run: bunx prisma migrate diff --from-schema-datasource "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  # ───────────────────────────────────────────
  # Job 5: Production build (z realno PostgreSQL bazo)
  # ───────────────────────────────────────────
  build:
    name: Build (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-prod"
      FURS_ENV: "test"
      FURS_ALLOW_SIMULATION: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Healthcheck — počakaj, da je Postgres pripravljen
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Push schema to PostgreSQL
        run: bunx prisma db push --skip-generate

      - name: "Build Next.js (production — TS errors fail, ignoreBuildErrors: false)"
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # ───────────────────────────────────────────
  # Job 6: Security audit (dependency + secret scan + unused deps)
  # ───────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Potrebno za gitleaks (pregled zgodovine)

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # P1-20: CRITICAL ranljivosti BLOKIRAJO build (next 16.1.7 RCE → 16.3.4
      # popravljeno 2026-09-09; sedaj 0 critical). high/moderate v dev-chain
      # (eslint/webpack/babel) ostanejo vidni v logih — ne blokirajo.
      - name: Run bun audit (CRITICAL = blocking)
        run: bun audit --severity critical

      - name: Check for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      # P1-deps: depcheck advisory (NEblokira — dynamic import-i povzročajo
      # false positive; rezultat je v logu za pregled)
      - name: Unused dependencies check (depcheck — advisory)
        run: npx --yes depcheck --json > depcheck.json && node -e "const d=require('./depcheck.json'); console.log('UNUSED deps:', d.dependencies.length, d.dependencies.join(', ')||'-'); console.log('UNUSED devDeps:', d.devDependencies.length, d.devDependencies.join(', ')||'-')" || true
        continue-on-error: true

  # ───────────────────────────────────────────
  # Job 7: E2E security tests (Playwright — 30 tests)
  # ───────────────────────────────────────────
  # CI runs 30 security tests (P0-C1..C5 validation) — already green.
  # Full 149 E2E tests run on staging server (requires proper auth setup
  # with matching NEXTAUTH_SECRET between seed and server runtime).
  # P1-20: requires build + unit + integration + migration (ni uspeha,
  # če spodnji stage-i padajo)
  e2e-security:
    name: E2E Security Tests (30)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, unit-tests, integration-tests, migration-test]
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"  # ⬅️ PostgreSQL namesto PGlite
      NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-prod"
      ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ENCRYPTION_KEY_VERSION: "ci-v1"
      FURS_ALLOW_SIMULATION: "true"
      NODE_ENV: "test"
      # P1-testiranje: E2E niz (core-flow + variante) nareda ~80+ API klicev/min —
      # dvignemo splošno rate limit mejo (produkcija obdrži privzetih 60/min)
      API_RATE_LIMIT_MAX: "600"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Push schema to PostgreSQL
        run: bunx prisma db push --skip-generate

      - name: Seed test data
        run: |
          # Seed admin user + lokaciji + menija + inventar z receptami za E2E teste
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const bcrypt = require('bcryptjs');
          const crypto = require('crypto');
          const db = new PrismaClient();
          (async () => {
            const pin = '1111';
            const pinHash = await bcrypt.hash(pin, 10);
            const pinLookup = crypto.createHmac('sha256', process.env.NEXTAUTH_SECRET).update(pin).digest('hex');
            await db.employee.upsert({ where: { email: 'admin@e2e.test' }, update: { pin: pinHash, pinLookup }, create: { id: 'test-admin', name: 'Test Admin', email: 'admin@e2e.test', role: 'admin', status: 'active', pin: pinHash, pinLookup, hireDate: new Date() } });
            await db.location.upsert({ where: { code: 'HQ' }, update: {}, create: { id: 'loc-1', name: 'Test Restavracija', code: 'HQ', type: 'restaurant', address: 'Testna 1', city: 'Ljubljana', postCode: '1000', country: 'SI', businessId: '12345678', taxId: 'SI12345678', registerNumber: 'TEST01', fursEnvironment: 'test', isActive: true } });
            // E2E varianta "dve lokaciji": druga lokacija + meni + miza
            // (premisesId je UNIQUE s privzetim '' — loc-2 MORA imeti svojega)
            await db.location.upsert({ where: { code: 'FIL2' }, update: {}, create: { id: 'loc-2', name: 'Test Filiala', code: 'FIL2', type: 'restaurant', address: 'Filialna 2', city: 'Maribor', postCode: '2000', country: 'SI', businessId: '87654321', taxId: 'SI87654321', registerNumber: 'TEST02', premisesId: 'PREM-TEST02', fursEnvironment: 'test', isActive: true } });
            await db.restaurantSettings.upsert({ where: { id: 'rs-1' }, update: {}, create: { id: 'rs-1', name: 'Test Restaurant', address: 'Testna 1', postCode: '1000', city: 'Ljubljana', businessId: '12345678', taxId: 'SI12345678', registerNumber: 'TEST01', fursEnvironment: 'test', isActive: true } });
            const menu = await db.menu.upsert({ where: { id: 'menu-1' }, update: {}, create: { id: 'menu-1', name: 'Test Menu', locationId: 'loc-1', isActive: true } });
            const cat = await db.category.upsert({ where: { id: 'cat-1' }, update: {}, create: { id: 'cat-1', name: 'Test Kategorija', menuId: 'menu-1' } });
            for (const [id, name, price, vat] of [['mi-1','Test Kava',1.50,22.0],['mi-2','Test Pizza',8.90,9.5],['mi-3','Test Solata',5.50,9.5]]) {
              await db.menuItem.upsert({ where: { id }, update: {}, create: { id, name, description: '', price, image: '', isAvailable: true, sortOrder: 0, vatRate: vat, categoryId: 'cat-1' } });
            }
            // Meni artikli lokacije 2
            await db.menu.upsert({ where: { id: 'menu-2' }, update: {}, create: { id: 'menu-2', name: 'Test Menu Filiala', locationId: 'loc-2', isActive: true } });
            await db.category.upsert({ where: { id: 'cat-2' }, update: {}, create: { id: 'cat-2', name: 'Test Kategorija Filiala', menuId: 'menu-2' } });
            for (const [id, name, price, vat] of [['mi-4','Test Kava Filiala',1.70,22.0],['mi-5','Test Burger Filiala',9.90,9.5]]) {
              await db.menuItem.upsert({ where: { id }, update: {}, create: { id, name, description: '', price, image: '', isAvailable: true, sortOrder: 0, vatRate: vat, categoryId: 'cat-2' } });
            }
            await db.table.upsert({ where: { id: 'table-1' }, update: {}, create: { id: 'table-1', number: 1, capacity: 4, status: 'available', area: 'main', posX: 10, posY: 10, width: 8, height: 10, shape: 'round', rotation: 0, locationId: 'loc-1' } });
            await db.table.upsert({ where: { id: 'table-2' }, update: {}, create: { id: 'table-2', number: 1, capacity: 4, status: 'available', area: 'main', posX: 20, posY: 10, width: 8, height: 10, shape: 'square', rotation: 0, locationId: 'loc-2' } });
            // E2E "verify inventory": inventar + recepte (mi-1/mi-4 → inv-kava, mi-5 → inv-burger)
            await db.inventoryItem.upsert({ where: { id: 'inv-kava' }, update: {}, create: { id: 'inv-kava', name: 'E2E Kava zrnje', description: 'E2E testna zaloga', unit: 'kos', quantity: 100, minQuantity: 10, costPerUnit: 5.0, supplier: 'E2E dobavitelj', category: 'general', location: 'main', servingsPerUnit: 1, costPerServing: 5.0 } });
            await db.inventoryItem.upsert({ where: { id: 'inv-burger' }, update: {}, create: { id: 'inv-burger', name: 'E2E Burger meso', description: 'E2E testna zaloga', unit: 'kos', quantity: 50, minQuantity: 5, costPerUnit: 3.0, supplier: 'E2E dobavitelj', category: 'general', location: 'main', servingsPerUnit: 1, costPerServing: 3.0 } });
            const recipes = [['recipe-kava-1','mi-1','inv-kava'],['recipe-kava-4','mi-4','inv-kava'],['recipe-burger-5','mi-5','inv-burger']];
            for (const [id, mi, inv] of recipes) {
              await db.recipeItem.upsert({ where: { menuItemId_inventoryItemId: { menuItemId: mi, inventoryItemId: inv } }, update: {}, create: { id, menuItemId: mi, inventoryItemId: inv, quantityPerServing: 1, unit: 'kos' } });
            }
            console.log('Seed complete');
            await db.\$disconnect();
          })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build Next.js
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144  # ⬆️ Povečano z 4096 na 6144 MB

      - name: Start production server and wait for health
        run: |
          nohup node .next/standalone/server.js > server.log 2>&1 &
          echo "Waiting for server to be ready..."
          # FIX: Use curl loop instead of wait-on (wait-on corrupts node_modules)
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Server is ready (attempt $i, HTTP $HTTP_CODE)"
              break
            fi
            echo "  Attempt $i: HTTP $HTTP_CODE, waiting 2s..."
            sleep 2
          done
          # Final check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Server failed to start. server.log:"
            cat server.log
            exit 1
          fi
        env:
          PORT: 3000

      - name: Run E2E tests (core flow + variante + observability + multi-tenant security)
        run: bunx playwright test tests/e2e/core-flow.spec.ts tests/e2e/flow-variants.spec.ts tests/e2e/observability.spec.ts tests/e2e/multi-tenant-security.spec.ts --project=chromium --reporter=list

      - name: Stop production server
        if: always()
        run: |
          pkill -f "node .next/standalone/server.js" || true
          echo "Server stopped"

      - name: Upload server logs on failure
        if: failure()
        run: cat server.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-security-results
          path: |
            test-results/
            playwright-report/
            server.log

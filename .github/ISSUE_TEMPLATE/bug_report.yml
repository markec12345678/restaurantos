name: 🐛 Bug Report
description: Prijavi napako v RestaurantOS
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Opis napake
      description: Jasen in jedrnat opis napake.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Koraki za reprodukcijo
      placeholder: |
        1. Pojdi v '...'
        2. Klikni na '...'
        3. Vidim napako
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL (če je spletna napaka)
      placeholder: https://restaurantos-...vercel.app/...
  - type: dropdown
    id: module
    attributes:
      label: Modul
      options:
        - POS (naročila)
        - KDS (kuhinja)
        - Waiter (natakar)
        - Plačila (Payments)
        - FURS (davčno potrjevanje)
        - Zaloga (Inventory)
        - Računovodstvo (Accounting)
        - Multi-tenant
        - Offline
        - Drugo
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logi / Error sporočilo
      render: shell

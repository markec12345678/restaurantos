# ============================================
# RestaurantOS — Playwright E2E (R94: real PostgreSQL)
# ============================================
# Ozadje (R91-FINAL backlog d → R93 → R94): stale e2e pini so dvakrat
# zamaskirali varnostne luknje (R91-1: /api/qr-menu P0-C3B residual; R90/R91
# shemski drift seeda). Sandbox (4GB) ne zmore celotnega e2e run-a — e2e teče
# TUKAJ na CI.
#
# R94 SPREMEMBA — PGlite → realni PostgreSQL (forenzika iz R93 CI run-a,
# run 35608656026): pod e2e obremenitvijo je nastalo 6× PGlite instanc na
# ISTEM dataDir (multi-worker/registry `globalThis` guard ne drži med
# procesi) → druga instanca abortira ob boot-u (WASM 'Aborted()' v callMain
# — lock stomp) → vse nadaljne seje/query padejo. PGlite je
# single-instance-per-dataDir; pod CI obremenitvijo ni uporaben za next dev.
# Realni PostgreSQL = hišni precedens (ci.yml integration-tests job) +
# produkciska pariteta (zunanji PG branch v lib/db.ts s connection poolom).
#
# Procedura: postgres service → prisma db push → e2e-seed.mjs (R94: skupni
# MODEL A fixture vir scripts/e2e-seed-data.mjs — isti seed kot lokalni
# PGlite) → next dev -p 3000 → /api/health 200 čakanje → playwright test.
name: E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

# Prekliče tekoče e2e run-e, ko nov commit prispe na isti ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"

jobs:
  e2e:
    name: Playwright E2E (PostgreSQL dev server)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Realni PostgreSQL — db.ts zunanja veja (connection pool), NIČ PGlite
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXTAUTH_SECRET: "e2e-test-secret-only"
      NEXTAUTH_URL: "http://localhost:3000"
      WS_BROADCAST_SECRET: "e2e-test-secret-only"
      FURS_ENV: "test"
      FURS_ALLOW_SIMULATION: "true"
      # P1-testiranje: e2e niz dela ~80+ API klicev/min — dvignemo splošno mejo
      API_RATE_LIMIT_MAX: "600"
      # R92-C: login testov nareda več kot 5 poskusov/min — dvignemo login mejo
      LOGIN_RATE_LIMIT_MAX: "100"
      PLAYWRIGHT_BASE_URL: "http://localhost:3000"
      CI: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Install Playwright chromium (+ system deps)
        run: bunx playwright install --with-deps chromium

      - name: Push schema to PostgreSQL
        run: bunx prisma db push --skip-generate

      - name: Seed e2e fixtures (MODEL A — skupni vir e2e-seed-data.mjs)
        run: node scripts/e2e-seed.mjs

      - name: Start next dev (port 3000) in background
        run: |
          nohup bunx next dev -p 3000 > /tmp/next-dev-e2e.log 2>&1 &
          echo "next dev PID: $!"

      - name: Wait for /api/health == 200 (max 5 min)
        run: |
          for i in $(seq 1 60); do
            sleep 5
            CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health || true)
            if [ "$CODE" = "200" ]; then
              echo "health 200 po ~$((i * 5))s"
              curl -s http://localhost:3000/api/health
              exit 0
            fi
          done
          echo "::error::next dev ni postal zdrav v 5 minutah — log:"
          tail -100 /tmp/next-dev-e2e.log
          exit 1

      - name: Run Playwright e2e (workers=1, retries=2, sekvenčno — POS deli bazo)
        run: bunx playwright test --reporter=list

      - name: Upload Playwright report + traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Dump next dev log (on failure)
        if: failure()
        run: tail -200 /tmp/next-dev-e2e.log

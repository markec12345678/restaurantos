# ============================================
# RestaurantOS — Continuous Integration
# Zažene se ob vsakem pushu in pull requestu
# ============================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Prekliče tekoče build-e, ko nov commit prispe na isti PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────
  # Job 1: Lint + Typecheck + Prisma validate
  # ───────────────────────────────────────────
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # prisma validate/generate zahtevajo, da je DATABASE_URL prisoten
      # (vrednost je dummy — validate preverja samo format schem-e, ne povezavo)
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: ESLint
        run: bun run lint

      - name: TypeScript typecheck (no emit)
        run: bunx tsc --noEmit

  # ───────────────────────────────────────────
  # Job 2: Production build (z realno PostgreSQL bazo)
  # ───────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-prod"
      FURS_ENV: "test"
      FURS_ALLOW_SIMULATION: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Healthcheck — počakaj, da je Postgres pripravljen
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Push schema to PostgreSQL
        run: bunx prisma db push --skip-generate

      - name: Build Next.js
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # ───────────────────────────────────────────
  # Job 3: Security audit (dependency + secret scan)
  # ───────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Potrebno za gitleaks (pregled zgodovine)

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run bun audit (dependency vulnerabilities)
        # continue-on-error: true pomeni, da audit ne blokira PR-ja,
        # a warningi so vidni v CI logih. Odstranil || true (dvojno zaščito).
        run: bun audit --severity moderate
        continue-on-error: true

      - name: Check for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # ───────────────────────────────────────────
  # Job 4: Unit tests (Vitest — 896+ tests including security)
  # ───────────────────────────────────────────
  unit-tests:
    name: Unit Tests (896+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-prod"
      ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ENCRYPTION_KEY_VERSION: "ci-v1"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run unit tests (896+ including security)
        run: bunx vitest run --reporter=verbose

      - name: Run security tests (P0-C1..C5 validation)
        run: bunx vitest run tests/unit/security/ --reporter=verbose

  # ───────────────────────────────────────────
  # Job 5: E2E security tests (Playwright — 30 tests)
  # ───────────────────────────────────────────
  # CI runs 30 security tests (P0-C1..C5 validation) — already green.
  # Full 149 E2E tests run on staging server (requires proper auth setup
  # with matching NEXTAUTH_SECRET between seed and server runtime).
  e2e-security:
    name: E2E Security Tests (30)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, unit-tests]
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"  # ⬅️ PostgreSQL namesto PGlite
      NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-prod"
      ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ENCRYPTION_KEY_VERSION: "ci-v1"
      FURS_ALLOW_SIMULATION: "true"
      NODE_ENV: "test"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Push schema to PostgreSQL
        run: bunx prisma db push --skip-generate

      - name: Seed test data
        run: |
          # Seed admin user + location + menu for E2E tests
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const bcrypt = require('bcryptjs');
          const crypto = require('crypto');
          const db = new PrismaClient();
          (async () => {
            const pin = '1111';
            const pinHash = await bcrypt.hash(pin, 10);
            const pinLookup = crypto.createHmac('sha256', process.env.NEXTAUTH_SECRET).update(pin).digest('hex');
            await db.employee.upsert({ where: { email: 'admin@e2e.test' }, update: { pin: pinHash, pinLookup }, create: { id: 'test-admin', name: 'Test Admin', email: 'admin@e2e.test', role: 'admin', status: 'active', pin: pinHash, pinLookup, hireDate: new Date() } });
            await db.location.upsert({ where: { code: 'HQ' }, update: {}, create: { id: 'loc-1', name: 'Test Restavracija', code: 'HQ', type: 'restaurant', address: 'Testna 1', city: 'Ljubljana', postCode: '1000', country: 'SI', businessId: '12345678', taxId: 'SI12345678', registerNumber: 'TEST01', fursEnvironment: 'test', isActive: true } });
            await db.restaurantSettings.upsert({ where: { id: 'rs-1' }, update: {}, create: { id: 'rs-1', name: 'Test Restaurant', address: 'Testna 1', postCode: '1000', city: 'Ljubljana', businessId: '12345678', taxId: 'SI12345678', registerNumber: 'TEST01', fursEnvironment: 'test', isActive: true } });
            const menu = await db.menu.upsert({ where: { id: 'menu-1' }, update: {}, create: { id: 'menu-1', name: 'Test Menu', locationId: 'loc-1', isActive: true } });
            const cat = await db.category.upsert({ where: { id: 'cat-1' }, update: {}, create: { id: 'cat-1', name: 'Test Kategorija', menuId: 'menu-1' } });
            for (const [id, name, price, vat] of [['mi-1','Test Kava',1.50,22.0],['mi-2','Test Pizza',8.90,9.5],['mi-3','Test Solata',5.50,9.5]]) {
              await db.menuItem.upsert({ where: { id }, update: {}, create: { id, name, description: '', price, image: '', isAvailable: true, sortOrder: 0, vatRate: vat, categoryId: 'cat-1' } });
            }
            await db.table.upsert({ where: { id: 'table-1' }, update: {}, create: { id: 'table-1', number: 1, capacity: 4, status: 'available', area: 'main', posX: 10, posY: 10, width: 8, height: 10, shape: 'round', rotation: 0, locationId: 'loc-1' } });
            console.log('Seed complete');
            await db.\$disconnect();
          })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build Next.js
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144  # ⬆️ Povečano z 4096 na 6144 MB

      - name: Start production server and wait for health
        run: |
          nohup node .next/standalone/server.js > server.log 2>&1 &
          echo "Waiting for server to be ready..."
          # FIX: Use curl loop instead of wait-on (wait-on corrupts node_modules)
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Server is ready (attempt $i, HTTP $HTTP_CODE)"
              break
            fi
            echo "  Attempt $i: HTTP $HTTP_CODE, waiting 2s..."
            sleep 2
          done
          # Final check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Server failed to start. server.log:"
            cat server.log
            exit 1
          fi
        env:
          PORT: 3000

      - name: Run E2E security tests (30 — P0-C1..C5 validation)
        run: bunx playwright test tests/e2e/multi-tenant-security.spec.ts --project=chromium --reporter=list

      - name: Stop production server
        if: always()
        run: |
          pkill -f "node .next/standalone/server.js" || true
          echo "Server stopped"

      - name: Upload server logs on failure
        if: failure()
        run: cat server.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-security-results
          path: |
            test-results/
            playwright-report/
            server.log

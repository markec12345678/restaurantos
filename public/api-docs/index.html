<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RestaurantOS API Documentation</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
<style>
  body { margin: 0; }
  .swagger-ui .topbar { display: none; }
  .swagger-ui .info { margin: 20px 15px; }
  .swagger-ui .info .title { color: #1e3a5f; }
  .header-bar {
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
    color: white;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .header-bar .logo {
    width: 32px;
    height: 32px;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #0f172a;
  }
  .header-bar h1 { font-size: 16px; font-weight: 700; margin: 0; }
  .header-bar .version {
    background: rgba(255,255,255,0.15);
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .header-bar .links { margin-left: auto; display: flex; gap: 16px; font-size: 13px; }
  .header-bar a { color: rgba(255,255,255,0.8); text-decoration: none; transition: color 0.15s; }
  .header-bar a:hover { color: white; }
</style>
</head>
<body>
<div class="header-bar">
  <div class="logo">R</div>
  <h1>RestaurantOS API</h1>
  <span class="version">v1.0.3</span>
  <div class="links">
    <a href="/api/health?detailed=true" target="_blank">Health</a>
    <a href="/pricing" target="_blank">Pricing</a>
    <a href="/landing" target="_blank">Home</a>
    <a href="https://github.com/markec12345678/restaurantos" target="_blank">GitHub</a>
  </div>
</div>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
<script>
  window.onload = () => {
    window.ui = SwaggerUIBundle({
      url: '/api-docs/openapi.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: 'BaseLayout',
      defaultModelsExpandDepth: 2,
      defaultModelExpandDepth: 2,
      docExpansion: 'list',
      filter: true,
      showExtensions: true,
      showCommonExtensions: true,
      tryItOutEnabled: false,
      requestSnippetsEnabled: true,
      requestSnippets: {
        generators: {
          curl_bash: { title: 'cURL', syntax: 'bash' },
          node_fetch: { title: 'Node.js', syntax: 'javascript' },
          python: { title: 'Python', syntax: 'python' },
        }
      }
    });
  };
</script>
</body>
</html>

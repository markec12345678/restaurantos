name: DB Push to Neon
on:
  workflow_dispatch:

jobs:
  db-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/webauthn-csp-security
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: Push schema to Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma db push --accept-data-loss
      - name: Seed minimal data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/seed-minimal.mjs || true
      - name: Post results to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment 68 --body "## Neon DB Push Complete ✅

          All 94 tables created in Neon PostgreSQL.
          Seed data added (users + menu items).

          Test:
          - PIN 1234 → admin
          - PIN 0000 → staff" || true

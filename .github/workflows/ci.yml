# ============================================
# RestaurantOS — Continuous Integration (P1-20)
# ============================================
# Minimalni CI pipeline — VSAK stage je BRAKING (noben continue-on-error
# na kvaliteti, razen eksplicitno dokumentiranih advisory korakov).
#
# Stages (uporabniška specifikacija):
#   1. install with frozen lockfile   (vsak job: bun install --frozen-lockfile)
#   2. typecheck                      (quality)
#   3. lint                           (quality — z WARNING BUDGETOM, glej spodaj)
#   4. unit tests                     (unit-tests)
#   5. integration tests              (integration-tests — pravi PostgreSQL)
#   6. migration test                 (migration-test — db push drift + migrate deploy + db:verify fail-closed)
#   7. build                          (build — production Next.js build)
#   8. security tests                 (security — bun audit CRITICAL blokira + gitleaks)
#   9. E2E tests                      (e2e-security — Playwright, zahteva build)
#
# Build NI uspešen, če: (uporabniška specifikacija)
#   - E2E testi padajo            → e2e-security job fail-a (ni continue-on-error)
#   - migration test pade         → migration-test job fail-a (drift = exit 1)
#   - TypeScript napake           → tsc --noEmit fail-a + next.config ignoreBuildErrors: false
#   - lint napake so warningi     → eslint --max-warnings 1486 (budget/ratchet —
#                                   NOVE warninge fail-a, obstoječe postopoma znižujemo)
#   - production build ni preverjen → build job zaze pravi `next build`
# ============================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Prekliče tekoče build-e, ko nov commit prispe na isti PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # P1-deps: pin bun verzijo (packageManager: bun@1.3.14 v package.json)
  # — reproducibilnost CI namesto "latest"
  BUN_VERSION: "1.3.14"

jobs:
  # ───────────────────────────────────────────
  # Job 1: Lint + Typecheck + Prisma validate
  # ───────────────────────────────────────────
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # prisma validate/generate zahtevajo, da je DATABASE_URL prisoten
      # (vrednost je dummy — validate preverja samo format schem-e, ne povezavo)
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bunx prisma validate --schema prisma/schema.prisma

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: ESLint (0 error + warning budget 1486)
        # P1-20: warningi NISO tiho zeleni — budget (ratchet) fail-a vsak NOVI
        # warning. Znižujemo ga postopoma (798 no-console + 675 no-unused-vars).
        run: npx eslint . --max-warnings 1486

      - name: TypeScript typecheck (no emit)
        run: bunx tsc --noEmit

  # ───────────────────────────────────────────
  # Job 2: Unit tests (Vitest — 1300+ tests, mockiran db)
  # ───────────────────────────────────────────
  unit-tests:
    name: Unit Tests (1300+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-prod"
      ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ENCRYPTION_KEY_VERSION: "ci-v1"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run unit tests (mocked db — fast feedback)
        run: bunx vitest run --reporter=dot

      - name: Run security tests (P0-C1..C5 + P1 matrika)
        run: bunx vitest run tests/unit/security/ --reporter=dot

  # ───────────────────────────────────────────
  # Job 3: Integration tests (P1-20 — NOV)
  # Pravi PostgreSQL + pravi Prisma klient (BREZ mockov)
  # ───────────────────────────────────────────
  integration-tests:
    name: Integration Tests (real DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-prod"
      ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ENCRYPTION_KEY_VERSION: "ci-v1"
      NODE_ENV: "test"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Push schema to PostgreSQL
        run: bunx prisma db push --skip-generate

      - name: Run integration tests (db-invariants — unique/FK/decimal/P2002)
        run: bun run test:integration -- --reporter=dot

  # ───────────────────────────────────────────
  # Job 4: Migration test (P1-20 — NOV)
  # Projekt je v1.3.0 prešel iz "db push flow" (prisma/migrations je bila
  # PRAZNA!) na PRAVE migracije (deploy audit 2026-09-09 — db-sync.mjs
  # odstranjen iz build skripte). Testira OBE poti:
  #   a) db push + drift check (razvojna pot)
  #   b) prisma migrate deploy + db:verify (DEPLOYMENT pot — fail-closed!)
  # ───────────────────────────────────────────
  migration-test:
    name: Migration Test (schema drift)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: "Test 1: schema → SQL DDL se uspešno generira"
        run: bunx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /dev/null

      - name: Push schema to fresh PostgreSQL
        run: bunx prisma db push --skip-generate

      - name: "Test 2: baza po db push NI v driftu s schemo (exit 1 = FAIL)"
        # migrate diff --exit-code vrne 1, če obstaja RAZLIKA med živo bazo in
        # schema.prisma. To ulovi: schema spremenjena, db push neveljaven/obskodovan.
        # POZOR: --from-schema-datasource pričakuje POT DO DATOTEKE sheme, ne URL
        # (v1.0.15 je CI padal na "file or directory not found" — lažni drift).
        # Za direktni URL povezave je pravilen flag: --from-url.
        run: bunx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: "Test 3: prisma migrate deploy na SVEŽI bazi (deployment pot)"
        # DEPLOY AUDIT 2026-09-09: migrate deploy je edina dovoljena pot za
        # spreminjanje baze ob deployu (db-sync iz build je ODSTRANJEN).
        # Test teče na LOČENI bazi (ci_migrate) — prve štiri zgoraj so pustile
        # tabelo _prisma_migrations v stanju "db push" (prazna), zato NE
        # smemo migrirati na isti bazi.
        env:
          MIGRATE_DB_URL: "postgresql://ci:ci@localhost:5432/ci_migrate?schema=public"
        run: |
          PG_CID=$(docker ps -q --filter "ancestor=postgres:16-alpine" | head -n1)
          docker exec "$PG_CID" psql -U ci -d ci -c 'CREATE DATABASE ci_migrate'
          DATABASE_URL="$MIGRATE_DB_URL" bunx prisma migrate deploy

      - name: "Test 4: db:verify — fail-closed invariante (exit 1 = FAIL)"
        # Preverja: _prisma_migrations aplicirane, 0 NULL locationId vrstic,
        # NOT NULL trditve, per-lokacijski + delni unique indeksi.
        # To je IDENTIČNA skripta, ki jo deploy zažene pred zagonom aplikacije
        # (docker compose run --rm migrate).
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_migrate?schema=public"
        run: bun run db:verify

      - name: "Test 5: migracija ODBIJE deploy ob nerazrešenih vrsticah (fail-closed)"
        # NEGATIVNI test (uporabniška zahteva): vrstica z NULL locationId
        # MORA povzročiti izhod 1 (nikoli samodejna dodelitev prvi lokaciji).
        # 0002_p1_hardening je že aplicirana v Testu 3 — vstavimo "legacy"
        # vrstico in preverimo, da db:verify ODBIJE.
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_migrate?schema=public"
        run: |
          PG_CID=$(docker ps -q --filter "ancestor=postgres:16-alpine" | head -n1)
          # Odstrani NOT NULL (simuliraj legacy bazo pred 0002), vstavi NULL vrstico
          docker exec "$PG_CID" psql -U ci -d ci_migrate \
            -c 'ALTER TABLE "Order" ALTER COLUMN "locationId" DROP NOT NULL' \
            -c 'INSERT INTO "Order" ("id", "orderNumber", "locationId", "createdAt", "updatedAt") VALUES (\'neg-test-1\', 999999, NULL, now(), now())'
          # db:verify MORA pasti (izhod != 0) — prej obrnjeno logiko preskočimo
          if bun run db:verify; then
            echo "::error::db:verify NI odbil nerazrešene vrstice — fail-closed je pokvarjen!"
            exit 1
          else
            echo "OK: db:verify je pravilno ZAVRNIL bazo z nerazrešeno vrstico (exit != 0)"
          fi

  # ───────────────────────────────────────────
  # Job 5: Production build (z realno PostgreSQL bazo)
  # ───────────────────────────────────────────
  build:
    name: Build (production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"
      NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-prod"
      FURS_ENV: "test"
      FURS_ALLOW_SIMULATION: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Healthcheck — počakaj, da je Postgres pripravljen
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Push schema to PostgreSQL
        run: bunx prisma db push --skip-generate

      - name: "Build Next.js (production — TS errors fail, ignoreBuildErrors: false)"
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # ───────────────────────────────────────────
  # Job 6: Security audit (dependency + secret scan + unused deps)
  # ───────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Potrebno za gitleaks (pregled zgodovine)

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      # P1-20: CRITICAL ranljivosti BLOKIRAJO build (next 16.1.7 RCE → 16.3.4
      # popravljeno 2026-09-09; sedaj 0 critical). high/moderate v dev-chain
      # (eslint/webpack/babel) ostanejo vidni v logih — ne blokirajo.
      # BUG-WORKAROUND: bun audit (v1.3.14) vrne exit 1 ob KATERIKOLI
      # ranljivosti in --severity ne vpliva niti na izhod niti exit kodo.
      # Zato preštejemo critical ranljivosti ročno iz JSON izhoda.
      - name: Run bun audit (CRITICAL = blocking)
        run: |
          bun audit --json > audit-report.json || true
          CRITICALS=$(jq '[.[][] | select(.severity == "critical")] | length' audit-report.json)
          TOTAL=$(jq '[.[][]] | length' audit-report.json)
          echo "Skupaj ranljivosti: $TOTAL | kritičnih: $CRITICALS"
          if [ "$CRITICALS" -gt 0 ]; then
            echo "::error::ZAZNANE $CRITICALS KRITIČNIH ranljivosti — build blokiran"
            jq -r 'to_entries[] | .key as $p | .value[] | select(.severity == "critical") | "  CRITICAL [$p] \(.title) — \(.url)"' audit-report.json
            exit 1
          fi
          echo "OK: 0 kritičnih ranljivosti — vrata prestavljena"

      - name: Check for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      # P1-deps: depcheck advisory (NEblokira — dynamic import-i povzročajo
      # false positive; rezultat je v logu za pregled)
      - name: Unused dependencies check (depcheck — advisory)
        run: npx --yes depcheck --json > depcheck.json && node -e "const d=require('./depcheck.json'); console.log('UNUSED deps:', d.dependencies.length, d.dependencies.join(', ')||'-'); console.log('UNUSED devDeps:', d.devDependencies.length, d.devDependencies.join(', ')||'-')" || true
        continue-on-error: true

  # ───────────────────────────────────────────
  # Job 7: E2E security tests (Playwright — 30 tests)
  # ───────────────────────────────────────────
  # CI runs 30 security tests (P0-C1..C5 validation) — already green.
  # Full 149 E2E tests run on staging server (requires proper auth setup
  # with matching NEXTAUTH_SECRET between seed and server runtime).
  # P1-20: requires build + unit + integration + migration (ni uspeha,
  # če spodnji stage-i padajo)
  e2e-security:
    name: E2E Security Tests (30)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, unit-tests, integration-tests, migration-test]
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci?schema=public"  # ⬅️ PostgreSQL namesto PGlite
      NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-prod"
      ENCRYPTION_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ENCRYPTION_KEY_VERSION: "ci-v1"
      FURS_ALLOW_SIMULATION: "true"
      NODE_ENV: "test"
      # P1-testiranje: E2E niz (core-flow + variante) nareda ~80+ API klicev/min —
      # dvignemo splošno rate limit mejo (produkcija obdrži privzetih 60/min)
      API_RATE_LIMIT_MAX: "600"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Push schema to PostgreSQL
        run: bunx prisma db push --skip-generate

      - name: Seed test data
        # FIX (run 539): prej inline `node -e "..."` — komentarji z dvojnimi
        # narekovaji so zaključili bash niz in skripta se je OBREZALA
        # (SyntaxError: Unexpected end of input). Seed je zdaj v datoteki.
        run: node scripts/e2e-seed.mjs

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Build Next.js
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144  # ⬆️ Povečano z 4096 na 6144 MB

      - name: Start production server and wait for health
        run: |
          nohup node .next/standalone/server.js > server.log 2>&1 &
          echo "Waiting for server to be ready..."
          # FIX: Use curl loop instead of wait-on (wait-on corrupts node_modules)
          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Server is ready (attempt $i, HTTP $HTTP_CODE)"
              break
            fi
            echo "  Attempt $i: HTTP $HTTP_CODE, waiting 2s..."
            sleep 2
          done
          # Final check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Server failed to start. server.log:"
            cat server.log
            exit 1
          fi
        env:
          PORT: 3000

      - name: Run E2E tests (core flow + variante + observability + multi-tenant security)
        run: bunx playwright test tests/e2e/core-flow.spec.ts tests/e2e/flow-variants.spec.ts tests/e2e/observability.spec.ts tests/e2e/multi-tenant-security.spec.ts --project=chromium --reporter=list

      - name: Stop production server
        if: always()
        run: |
          pkill -f "node .next/standalone/server.js" || true
          echo "Server stopped"

      - name: Upload server logs on failure
        if: failure()
        run: cat server.log

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-security-results
          path: |
            test-results/
            playwright-report/
            server.log
